name: Build Installer

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref. A tag run publishes a release, so it must never be
  # cancelled part-way through by a later push.
  group: installer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Cheap pre-flight. Catching a tag/version mismatch here costs seconds,
  # whereas the same check after the build wastes a full Windows build.
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Tags here are written two-part (v5.0) while wails.json is three-part
      # (5.0.0), so compare a zero-padded normal form rather than literally.
      # A tag may also carry a prerelease suffix (v5.1-beta1).
      - name: Read product version and verify the tag
        id: meta
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          normalize() {
            local v="${1#v}"   # drop a leading "v"
            v="${v%%-*}"       # drop any prerelease suffix
            local a b c
            IFS='.' read -r a b c <<< "$v"
            printf '%s.%s.%s' "${a:-0}" "${b:-0}" "${c:-0}"
          }

          version="$(jq -r '.info.productVersion' wails.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::wails.json has no info.productVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wails.json productVersion: $version"

          prerelease=false
          if [ "$IS_TAG" = "true" ]; then
            if [ "$(normalize "$TAG")" != "$(normalize "$version")" ]; then
              echo "::error::Tag $TAG ($(normalize "$TAG")) does not match wails.json productVersion $version ($(normalize "$version")). Bump wails.json before tagging."
              exit 1
            fi
            case "$TAG" in *-*) prerelease=true ;; esac
            echo "Tag $TAG matches wails.json version $version (prerelease=$prerelease)."
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Windows installer
    needs: check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pin the CLI to the same Wails the module builds against. The CLI
      # regenerates build/windows/installer/wails_tools.nsh on every -nsis
      # build, so a mismatched CLI would quietly change the installer.
      - name: Resolve the Wails CLI version
        id: wails
        run: |
          $match = Select-String -Path go.mod -Pattern '^\s+github\.com/wailsapp/wails/v2\s+(v\S+)' |
                   Select-Object -First 1
          if (-not $match) {
            Write-Host "::error::Could not find the Wails version in go.mod"
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "Wails CLI version from go.mod: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The CLI is not a dependency of this module, so it is absent from go.sum
      # and from the module cache setup-go restores. Installing it therefore
      # always reaches out to proxy.golang.org and sum.golang.org. Cache the
      # compiled binary so a repeat run needs neither.
      - name: Restore the cached Wails CLI
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails.exe
          key: wails-cli-${{ runner.os }}-${{ steps.wails.outputs.version }}

      # proxy.golang.org and sum.golang.org both flake now and then, dropping
      # the connection mid-response ("stream error ... INTERNAL_ERROR"). That is
      # transient, so retry it instead of failing the run. Verification stays on.
      - name: Install the Wails CLI
        if: steps.wails-cache.outputs.cache-hit != 'true'
        env:
          WAILS_VERSION: ${{ steps.wails.outputs.version }}
        run: |
          # GitHub runs pwsh with $ErrorActionPreference = 'stop'. Keep a
          # non-zero exit from a native command a plain exit code rather than a
          # terminating error, or the retry below would never get a second go.
          $PSNativeCommandUseErrorActionPreference = $false
          $pkg = "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VERSION"
          $attempts = 4
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "go install $pkg (attempt $i of $attempts)"
            go install $pkg
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) {
              $wait = 5 * $i
              Write-Host "::warning::go install failed with exit code $LASTEXITCODE - retrying in $wait seconds"
              Start-Sleep -Seconds $wait
            }
          }
          Write-Host "::error::go install $pkg failed after $attempts attempts"
          exit 1

      - name: Check the Wails CLI runs
        run: |
          $gobin = Join-Path (go env GOPATH) 'bin'
          if (-not (Test-Path (Join-Path $gobin 'wails.exe'))) {
            Write-Host "::error::wails.exe is missing from $gobin"
            exit 1
          }
          # setup-go normally puts this on PATH; make sure, since a cache
          # restore writes the binary without going through the toolchain.
          $gobin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $gobin 'wails.exe') version

      # Same flake risk as above, on a cold module cache. Fetching up front
      # keeps it out of the test and build steps, which are slow to redo.
      - name: Download Go modules
        run: |
          # GitHub runs pwsh with $ErrorActionPreference = 'stop'. Keep a
          # non-zero exit from a native command a plain exit code rather than a
          # terminating error, or the retry below would never get a second go.
          $PSNativeCommandUseErrorActionPreference = $false
          $attempts = 4
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "go mod download (attempt $i of $attempts)"
            go mod download
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) {
              $wait = 5 * $i
              Write-Host "::warning::go mod download failed with exit code $LASTEXITCODE - retrying in $wait seconds"
              Start-Sleep -Seconds $wait
            }
          }
          Write-Host "::error::go mod download failed after $attempts attempts"
          exit 1

      # Getting this right has been fiddly. choco exits 0 yet drops makensis
      # in its own shim directory rather than under Program Files, and the
      # machine PATH it edits is invisible to an already-running process. So
      # search every plausible location, re-read PATH from the registry the way
      # refreshenv does, and report what was actually on disk if it still is
      # not found - job logs need admin rights on the repo, so anything not
      # emitted as an annotation cannot be read back.
      - name: Ensure NSIS is available
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          function Update-PathFromRegistry {
            $parts = @(
              [Environment]::GetEnvironmentVariable('Path', 'Machine')
              [Environment]::GetEnvironmentVariable('Path', 'User')
              $env:PATH
            ) | Where-Object { $_ }
            $env:PATH = ($parts -join ';')
          }

          # -Deep walks all of Program Files, which takes tens of seconds on a
          # runner, so it is reserved for the point where the cheap lookups have
          # already failed rather than run on every call.
          function Find-MakeNSIS {
            param([switch]$Deep)

            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $dirs = @(
              "$env:ProgramFiles\NSIS"
              "${env:ProgramFiles(x86)}\NSIS"
              "$env:ChocolateyInstall\bin"
              "$env:ChocolateyInstall\lib\nsis\tools"
              'C:\ProgramData\chocolatey\bin'
              'C:\ProgramData\chocolatey\lib\nsis\tools'
            ) | Where-Object { $_ }
            foreach ($dir in $dirs) {
              $exe = Join-Path $dir 'makensis.exe'
              if (Test-Path $exe) { return (Resolve-Path $exe).Path }
            }

            if (-not $Deep) { return $null }

            Write-Host "  searching disk for makensis.exe"
            foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\ProgramData\chocolatey')) {
              if (-not $root -or -not (Test-Path $root)) { continue }
              $hit = Get-ChildItem -Path $root -Filter makensis.exe -Recurse -File `
                       -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          $found = Find-MakeNSIS
          if ($found) {
            Write-Host "NSIS was already present."
          } else {
            $attempts = 3
            for ($i = 1; $i -le $attempts; $i++) {
              Write-Host "choco install nsis (attempt $i of $attempts)"
              choco install nsis --no-progress -y
              $code = $LASTEXITCODE
              Update-PathFromRegistry
              $found = Find-MakeNSIS -Deep:($i -eq $attempts)
              if ($found) { break }
              Write-Host "::warning::NSIS still not found after choco exited with $code"
              if ($i -lt $attempts) { Start-Sleep -Seconds (5 * $i) }
            }
          }

          if (-not $found) {
            # Surface the evidence as annotations, since the log is unreadable.
            $seen = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Directory -ErrorAction SilentlyContinue |
                    Select-Object -ExpandProperty Name
            Write-Host "::warning::chocolatey packages present: $($seen -join ', ')"
            foreach ($dir in @('C:\ProgramData\chocolatey\bin', "$env:ProgramFiles\NSIS", "${env:ProgramFiles(x86)}\NSIS")) {
              Write-Host "::warning::$dir exists=$(Test-Path $dir)"
            }
            Write-Host "::error::NSIS (makensis.exe) could not be installed, so the installer cannot be built"
            exit 1
          }

          Write-Host "makensis: $found"
          Split-Path $found -Parent | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $found /VERSION
          Write-Host ""

      # main.go embeds all:frontend/dist, so the Go package does not compile
      # until the frontend has been built - and frontend/dist is gitignored, so
      # a fresh checkout has none. wails build would produce it, but that runs
      # later, and tests should gate the slow Windows build rather than trail it.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/index.html)) {
            Write-Host "::error::The frontend build produced no frontend/dist/index.html"
            exit 1
          }

      - name: Run tests
        run: go test ./...

      - name: Build app and NSIS installer
        run: |
          .\build_release.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_release.ps1 failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # Termi is not code-signed, so publish hashes people can check against
      # what they downloaded.
      - name: Generate checksums
        working-directory: build/bin
        run: |
          Get-ChildItem -Filter *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Termi-v${{ needs.check.outputs.version }}-windows-amd64
          path: |
            build/bin/Termi-v${{ needs.check.outputs.version }}-setup.exe
            build/bin/Termi-v${{ needs.check.outputs.version }}.exe
            build/bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo '### Downloads'
            echo
            echo "| File | Use it for |"
            echo "| --- | --- |"
            echo "| \`Termi-v${VERSION}-setup.exe\` | **Installer.** Installs to \`Program Files\`, adds Start Menu and desktop shortcuts, and puts \`termi\` on your PATH. Run this to upgrade an existing install. |"
            echo "| \`Termi-v${VERSION}.exe\` | **Portable.** Runs on its own with no install. It does *not* update an installed copy — the two are separate. |"
            echo "| \`SHA256SUMS.txt\` | Checksums for the two files above. |"
            echo
            echo '> Termi is not code-signed, so Windows SmartScreen will warn on first run.'
            echo '> Choose **More info → Run anyway**, or verify the download against `SHA256SUMS.txt` first.'
            echo
          } > notes.md
          cat notes.md

      # Re-running a tag should not fail, so update the release if it exists.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No build artifacts were downloaded"
            exit 1
          fi
          printf 'Publishing %s asset(s):\n' "${#assets[@]}"
          printf '  %s\n' "${assets[@]}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating it."
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Termi $TAG" --notes-file notes.md
          else
            flags=(
              --repo "$GITHUB_REPOSITORY"
              --title "Termi $TAG"
              --notes-file notes.md
              --generate-notes
            )
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi
